<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lang Systems email signature template</title>
  </head>
  <body style="margin: 24px; background: #ffffff;">
    <!--
      EDIT ONLY:
      1. {{EMPLOYEE_NAME}}
      2. {{EMPLOYEE_TITLE}}
      3. {{EMPLOYEE_PHONE}}

      Remove the complete OPTIONAL PHONE ROW if no phone number is supplied.
      Keep all Lang Systems business details, colours, logo URLs and spacing unchanged.
    -->
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="width: 100%; max-width: 560px; border-collapse: collapse; font-family: Inter, 'Segoe UI', Arial, sans-serif; color: #13072f;">
      <tr>
        <td width="112" valign="top" style="width: 112px; padding: 2px 18px 2px 0; vertical-align: top;">
          <a href="https://langsystems.com.au/" style="text-decoration: none;" aria-label="Visit the Lang Systems website">
            <img src="https://langsystems.com.au/assets/lang-systems-mark-outline.png" width="94" height="73" alt="Lang Systems" style="display: block; width: 94px; height: 73px; border: 0; outline: none; text-decoration: none;" />
          </a>
        </td>
        <td valign="top" style="padding: 0 0 0 18px; border-left: 3px solid #6c19ff; vertical-align: top;">
          <div style="margin: 0; font-size: 21px; line-height: 25px; font-weight: 700; letter-spacing: -0.2px; color: #13072f;">{{EMPLOYEE_NAME}}</div>
          <div style="margin: 3px 0 0; font-size: 12px; line-height: 17px; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase; color: #6c19ff;">{{EMPLOYEE_TITLE}}</div>

          <div style="margin: 12px 0 0; font-size: 14px; line-height: 19px; font-weight: 700; letter-spacing: 0.7px; color: #250861;">LANG SYSTEMS</div>
          <div style="margin: 1px 0 9px; font-size: 11px; line-height: 16px; color: #635d78;">Idea to production ready software.</div>

          <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="border-collapse: collapse; font-family: Inter, 'Segoe UI', Arial, sans-serif;">
            <tr>
              <td style="padding: 0 9px 3px 0; font-size: 11px; line-height: 16px; font-weight: 700; color: #6c19ff;">E</td>
              <td style="padding: 0 0 3px; font-size: 12px; line-height: 16px; color: #2c2352;"><a href="mailto:langsystemsdesign@outlook.com" style="color: #2c2352; text-decoration: none;">langsystemsdesign@outlook.com</a></td>
            </tr>
            <!-- OPTIONAL PHONE ROW: remove this entire <tr> when no employee phone number is supplied. -->
            <tr>
              <td style="padding: 0 9px 3px 0; font-size: 11px; line-height: 16px; font-weight: 700; color: #6c19ff;">P</td>
              <td style="padding: 0 0 3px; font-size: 12px; line-height: 16px; color: #2c2352;"><a href="tel:{{EMPLOYEE_PHONE}}" style="color: #2c2352; text-decoration: none;">{{EMPLOYEE_PHONE}}</a></td>
            </tr>
            <tr>
              <td style="padding: 0 9px 0 0; font-size: 11px; line-height: 16px; font-weight: 700; color: #6c19ff;">W</td>
              <td style="padding: 0; font-size: 12px; line-height: 16px; color: #2c2352;"><a href="https://langsystems.com.au/" style="color: #2c2352; text-decoration: none;">langsystems.com.au</a></td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
